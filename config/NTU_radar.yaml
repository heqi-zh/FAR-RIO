input:
    bag_file: ""                 # Offline input: set your bag path here.

output:
    directory: "../output"       # Relative paths are resolved from this YAML file.

common:
    radar_topic:  "/radar_enhanced_pcl"
    imu_topic:  "/vectornav/imu"
    
preprocess:
    radar_type: 5                # Radar format: 4 for Snail, 5 for NTU

mapping:
    acc_cov: 0.002
    gyr_cov: 0.0001
    b_acc_cov: 0.0001
    b_gyr_cov: 0.000002
    fov_degree:    130
    det_range:     400.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-Radar extrinsic
    extrinsic_T: [-0.3176955976234, 0.13761019052125, -0.05898352725152]
    extrinsic_R: [0.999735807578, 0.0215215701795, 0.0081643477385,
                 -0.02148120581797, 0.9997581134183, -0.00502853428037,
                 -0.00826995351904, 0.0048509797951, 0.99995400578406]
    # extrinsic_T: [-0.3176955976234, -0.13761019052125, 0.05898352725152]
    # extrinsic_R: [0.999735807578, -0.0215215701795, -0.0081643477385,
    #              -0.02148120581797, -0.9997581134183, 0.00502853428037,
    #              -0.00826995351904, -0.0048509797951, -0.99995400578406]
    # extrinsic_T_ri : [ 0.99299597,  0.10192327,  0.05976348, -0.06827023,
    #                 -0.09943785,  0.99410623, -0.04318726,  0.00799113,
    #                 -0.06381254,  0.03694178,  0.99727782, -0.06975817,
    #                  0.        ,  0.        ,  0.        ,  1.        ]

publish:
    path_publish_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    scan_effect_pub_en: true    # true: publish the pointscloud of effect point
    dense_publish_en: false       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

path_save_en: true

pcd_save:
    pcd_save_en: true
    interval: -1                 # how many radar frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
max_iteration: 5
filter_size_surf: 0.5
filter_size_map: 0.5             # 暂时未用到，代码中为0， 即倾向于将降采样后的scan中的所有点加入map
cube_side_length: 1000

ivox_grid_resolution: 0.5        # default=0.2
ivox_nearby_type: 18             # 6, 18, 26
esti_plane_threshold: 0.1        # default=0.1

keyframe:
    #keyframe_enable: true
    keyframe_distance: 2
    keyframe_rotation: 0.25
    keyframe_roll: 0.2
    keyframe_pitch: 0.1
    keyframe_yaw: 0.2
    keyframe_all: false
    keyframe_none: false
    all_scan_matching: false
